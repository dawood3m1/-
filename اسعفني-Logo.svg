<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="256" height="256" role="img" aria-label="شعار تطبيق اسعفني">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1F4A9E" />
      <stop offset="1" stop-color="#193C68" />
    </linearGradient>
    <linearGradient id="crossGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E63B46" />
      <stop offset="1" stop-color="#DC1B30" />
    </linearGradient>
  </defs>

  <!-- الخلفية الدائرية -->
  <circle cx="100" cy="100" r="98" fill="url(#bgGrad)" />

  <!-- مسارات الدارة الإلكترونية -->
  <g stroke="#782850" stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M 34 42 H 64 V 72" />
    <path d="M 166 42 H 136 V 72" />
    <path d="M 34 158 H 64 V 132" />
    <path d="M 166 158 H 136 V 132" />
  </g>
  <g fill="#782850">
    <circle cx="34" cy="42" r="5" />
    <circle cx="166" cy="42" r="5" />
    <circle cx="34" cy="158" r="5" />
    <circle cx="166" cy="158" r="5" />
  </g>

  <!-- لمبة الإسعاف -->
  <rect x="93" y="66" width="14" height="14" rx="4" fill="#DC1B30" />
  <rect x="93" y="66" width="14" height="7" rx="3.5" fill="#E63B46" />

  <!-- جسم الإسعاف -->
  <rect x="48" y="82" width="104" height="46" rx="10" fill="#FFFFFF" />

  <!-- الزجاج الأمامي -->
  <rect x="143" y="90" width="7" height="28" rx="3.5" fill="#193C68" opacity="0.9" />

  <!-- الصليب الطبي -->
  <g fill="url(#crossGrad)">
    <rect x="70" y="93" width="14" height="24" rx="4" />
    <rect x="63" y="100" width="28" height="14" rx="4" />
  </g>

  <!-- العجلات -->
  <g>
    <circle cx="76" cy="127" r="7" fill="#FFFFFF" />
    <circle cx="124" cy="127" r="7" fill="#FFFFFF" />
    <circle cx="76" cy="127" r="3" fill="#193C68" />
    <circle cx="124" cy="127" r="3" fill="#193C68" />
  </g>
</svg>